<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE WORKERS | ACCESO</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;700&display=swap');

        :root {
            --red: #eb0000;
            --black: #000000;
            --white: #ffffff;
            --yellow: #f0f000;
        }

        /* Reset y Base */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--black);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            overflow-x: hidden;
        }

        /* Fondo dinámico adaptable */
        .bg-layer {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, #0a0a0a 0px, #0a0a0a 2px, #000 2px, #000 10px);
            z-index: -2;
        }

        .red-stripe {
            position: fixed;
            width: 200%; height: 150px;
            background: var(--red);
            top: 20%; left: -50%;
            transform: rotate(-15deg);
            z-index: -1;
            opacity: 0.8;
        }

        /* Contenedor Principal Responsivo */
        .viewport {
            position: relative;
            width: 95%;
            max-width: 420px;
            min-height: 600px;
            margin: 20px auto;
        }

        /* Tarjetas con corrección de escala para celular */
        .auth-card {
            position: absolute;
            width: 100%;
            padding: 30px 20px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backface-visibility: hidden;
        }

        .login-wrap {
            background: var(--white);
            clip-path: polygon(0 2%, 100% 0, 96% 98%, 4% 100%);
            transform: rotate(-2deg);
            z-index: 10;
        }

        .viewport.reg-active .login-wrap {
            transform: translateX(-120%) rotate(-10deg);
            opacity: 0;
        }

        .reg-wrap {
            background: var(--red);
            clip-path: polygon(4% 0, 100% 4%, 96% 100%, 0 96%);
            transform: translateX(120%) rotate(10deg);
            opacity: 0;
            z-index: 5;
        }

        .viewport.reg-active .reg-wrap {
            transform: translateX(0) rotate(2deg);
            opacity: 1;
        }

        /* Títulos Responsivos */
        .title {
            font-family: 'Anton', sans-serif;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-align: center;
        }

        .title span {
            display: inline-block;
            background: var(--black);
            color: var(--white);
            padding: 2px 8px;
            margin: 2px;
            font-size: clamp(1.8rem, 8vw, 2.5rem);
            transform: rotate(-3deg);
        }

        /* Inputs ajustados para pantallas táctiles */
        .field { margin-bottom: 12px; }
        label {
            display: block;
            font-weight: 700;
            color: var(--red);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .reg-wrap label { color: var(--black); }

        input {
            width: 100%;
            border: 2px solid var(--black);
            padding: 12px;
            font-size: 16px;
            font-family: 'Oswald';
            background: #f0f0f0;
            outline: none;
        }

        input:focus {
            background: var(--yellow);
            transform: skewX(-3deg);
        }

        /* Botones Pulidos */
        .btn {
            width: 100%;
            padding: 14px;
            font-family: 'Anton';
            font-size: 1.3rem;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.2s;
        }

        .btn-main { background: var(--black); color: var(--white); clip-path: polygon(0 0, 100% 10%, 95% 100%, 5% 90%); }
        .btn-google {
            background: white; color: black; border: 2px solid black;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-size: 0.9rem; font-weight: bold;
        }

        /* ALERTA Y MODAL RESPONSIVO */
        .alert-p5, .modal-p5 {
            position: fixed;
            width: 85%;
            max-width: 350px;
            background: var(--black);
            color: var(--white);
            border-left: 8px solid var(--red);
            padding: 20px;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 2000;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.85);
        }

        .alert-p5.active, .modal-p5.active { transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
        .alert-p5 h3, .modal-p5 h3 { font-family: 'Anton'; font-size: 2rem; margin: 0; color: var(--red); }

        .modal-p5 { background: var(--yellow); color: var(--black); border-left: 8px solid var(--black); }
        .modal-p5 h3 { color: var(--black); }
        .modal-p5 p { font-size: 0.9rem; font-weight: bold; margin: 10px 0; }

        .switcher {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            text-decoration: underline;
            font-size: 0.85rem;
            color: var(--black);
            cursor: pointer;
        }
        .reg-wrap .switcher { color: white; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>
    <div class="red-stripe"></div>

    <div id="p5Alert" class="alert-p5">
        <h3 id="alertTitle">¡ERROR!</h3>
        <p id="alertDesc">DATOS INCORRECTOS</p>
        <button onclick="closeAlert()" class="btn btn-main" style="font-size: 1rem; padding: 10px; background: var(--red);">CONTINUAR</button>
    </div>

    <div id="recoveryModal" class="modal-p5">
        <h3>RECUPE-RACIÓN</h3>
        <p>Enviaremos un enlace a tu correo para restablecer tu clave de acceso.</p>
        <div class="field">
            <input type="email" id="resetEmail" placeholder="TU EMAIL AQUÍ...">
        </div>
        <button id="btnSendReset" class="btn btn-main">ENVIAR ENLACE</button>
        <div class="switcher" style="color: black;" onclick="closeRecovery()">VOLVER</div>
    </div>

    <div class="viewport" id="viewport">
        <div class="auth-card login-wrap">
            <div class="title">
                <span>T</span><span>H</span><span>E</span><br>
                <span>W</span><span>O</span><span>R</span><span>K</span><span>E</span><span>R</span><span>S</span>
            </div>

            <button class="btn btn-google" id="btnGoogle">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                ACCESO GOOGLE
            </button>

            <div class="field">
                <label>TRABAJADOR ID</label>
                <input type="email" id="logEmail" placeholder="Email...">
            </div>
            <div class="field">
                <label>PASSWORD</label>
                <input type="password" id="logPass" placeholder="******">
            </div>

            <button class="btn btn-main" id="btnLog">EJECUTAR</button>
            <div class="switcher" onclick="showRecovery()">¿OLVIDASTE TU CLAVE?</div>
            <div class="switcher" style="text-decoration: none; color: var(--red);" onclick="toggleAuth()">NUEVO REGISTRO</div>
        </div>

        <div class="auth-card reg-wrap">
            <h2 style="font-family:'Anton'; color:black; font-size:2.5rem; margin:0; text-align:center;">UNIRSE</h2>
            <p style="text-align:center; font-weight:bold; margin-bottom:20px; color: black;">NUEVO RECLUTA</p>
            
            <div class="field">
                <label>EMAIL</label>
                <input type="email" id="regEmail">
            </div>
            <div class="field">
                <label>CREAR CLAVE</label>
                <input type="password" id="regPass">
            </div>

            <button class="btn btn-main" id="btnReg">CREAR PERFIL</button>
            <div class="switcher" onclick="toggleAuth()">VOLVER AL ACCESO</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjTFuASVM9JpXtM04dKwgaO2bC_thSxXs",
            authDomain: "the-workes.firebaseapp.com",
            projectId: "the-workes",
            storageBucket: "the-workes.firebasestorage.app",
            messagingSenderId: "836433638146",
            appId: "1:836433638146:web:2c1bb69904a82e2f49c81b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // Control de Vistas
        window.toggleAuth = () => document.getElementById('viewport').classList.toggle('reg-active');
        window.showRecovery = () => document.getElementById('recoveryModal').classList.add('active');
        window.closeRecovery = () => document.getElementById('recoveryModal').classList.remove('active');

        window.showAlert = (title, desc) => {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertDesc').innerText = desc;
            document.getElementById('p5Alert').classList.add('active');
        }
        window.closeAlert = () => document.getElementById('p5Alert').classList.remove('active');

        // Acciones Firebase
        document.getElementById('btnLog').onclick = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('logEmail').value, document.getElementById('logPass').value);
                window.location.href = "index.html";
            } catch (e) { showAlert("¡DENEGADO!", "CREDENCIALES INVÁLIDAS"); }
        }

        document.getElementById('btnGoogle').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
                window.location.href = "index.html";
            } catch (e) { showAlert("ERROR", "OPERACIÓN CANCELADA"); }
        }

        document.getElementById('btnReg').onclick = async () => {
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPass').value);
                showAlert("ÉXITO", "PERFIL CREADO");
                setTimeout(() => toggleAuth(), 2000);
            } catch (e) { showAlert("FALLO", "EL CORREO YA EXISTE"); }
        }

        document.getElementById('btnSendReset').onclick = async () => {
            const email = document.getElementById('resetEmail').value;
            if(!email) return showAlert("ERROR", "INGRESA TU EMAIL");
            try {
                await sendPasswordResetEmail(auth, email);
                showAlert("ENVIADO", "REVISA TU CORREO");
                closeRecovery();
            } catch (e) { showAlert("FALLO", "EMAIL NO ENCONTRADO"); }
        }
    </script>
</body>
</html>
