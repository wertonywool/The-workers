<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Workers - Pendientes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;500;700&display=swap');

        :root {
            --p5-red: #d31212;
            --p5-bright-red: #ff1a1a;
            --p5-black: #0a0a0a;
            --p5-dark-gray: #1a1a1a;
            --p5-white: #eeeeee;
            --p5-green: #00ff00;
        }

        * { box-sizing: border-box; }
        body {
            background-color: var(--p5-black);
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                              repeating-linear-gradient(45deg, #151515 0, #151515 1px, transparent 0, transparent 50%);
            background-size: 10px 10px;
            color: var(--p5-white);
            font-family: 'Oswald', sans-serif;
            margin: 0; padding: 15px;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* --- HEADER --- */
        .header {
            background: var(--p5-black);
            padding: 40px 20px;
            margin: -15px -15px 30px -15px;
            text-align: center;
            border-bottom: 5px solid var(--p5-red);
            position: relative;
        }

        .title-wrapper {
            position: relative;
            display: inline-block;
            transform: rotate(-2deg);
        }

        h1 { 
            font-family: 'Anton'; 
            font-size: clamp(2.5rem, 8vw, 4rem); 
            margin: 0; 
            color: var(--p5-white); 
            text-transform: uppercase;
            letter-spacing: -2px;
            text-shadow: 4px 4px 0 var(--p5-red), -2px -2px 0 var(--p5-black);
        }

        .header-subtitle {
            font-family: 'Anton';
            background: var(--p5-white);
            color: var(--p5-black);
            padding: 2px 15px;
            font-size: 1.2rem;
            display: inline-block;
            transform: skewX(-15deg);
            margin-top: 5px;
        }

        /* --- CONTENEDOR DE MISIONES --- */
        .mission-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .m-card {
            background: var(--p5-dark-gray);
            border: 1px solid #333;
            border-left: 8px solid var(--p5-red);
            display: flex;
            align-items: center;
            transition: 0.3s;
            cursor: pointer;
            overflow: hidden;
        }

        .m-card:hover { transform: translateX(10px) rotate(1deg); background: #222; }

        .m-icon {
            width: 60px; height: 60px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(211, 18, 18, 0.1);
            font-size: 1.5rem; color: var(--p5-red);
        }

        .m-info { padding: 10px 15px; flex: 1; }
        .m-info h3 { margin: 0; font-family: 'Anton'; font-size: 1.1rem; text-transform: uppercase; line-height: 1.1; }
        .m-info p { margin: 5px 0 0 0; font-size: 0.75rem; color: #888; font-weight: bold; }

        /* --- MODAL --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { 
            background: var(--p5-white); 
            color: var(--p5-black); 
            width: 90%; max-width: 450px;
            padding: 30px; 
            clip-path: polygon(2% 5%, 100% 0, 98% 95%, 0 100%);
        }
        
        #mTitle { font-family: 'Anton'; font-size: 2.2rem; border-bottom: 5px solid var(--p5-black); text-transform: uppercase; margin-bottom: 15px; }
        #mDesc { font-size: 1rem; margin: 15px 0; border-left: 5px solid var(--p5-red); padding-left: 15px; font-weight: 500; }

        .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
        .m-btn { 
            flex: 1; padding: 15px; border: none; font-family: 'Anton'; font-size: 1rem; cursor: pointer; transition: 0.2s; 
            clip-path: polygon(0 0, 100% 20%, 100% 100%, 0 80%);
        }
        .m-btn-ok { background: var(--p5-green); color: black; }
        .m-btn-cancel { background: var(--p5-black); color: white; }

        /* --- TAB BAR --- */
        .tab-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: black; display: flex; justify-content: space-around; padding: 12px 0; border-top: 3px solid var(--p5-red); z-index: 2000; }
        .tab-item { color: #555; text-decoration: none; text-align: center; font-family: 'Anton'; font-size: 0.65rem; }
        .tab-item i { display: block; font-size: 1.3rem; margin-bottom: 4px; }
        .tab-item.active { color: var(--p5-red); transform: translateY(-3px); }

        #loadingScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 5000; display: none; justify-content: center; align-items: center; }
        .load-text { font-family: 'Anton'; font-size: 2rem; color: white; text-transform: uppercase; animation: pulse 1s infinite; }

        #rankUpAnim { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 4000; display: none; justify-content: center; align-items: center; cursor: pointer; }
        .clear-title { font-family: 'Anton'; font-size: 5rem; color: white; margin: 0; text-shadow: 0 0 20px var(--p5-red), 4px 4px 0 black; font-style: italic; transform: rotate(-5deg); }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loadingScreen"><div class="load-text">SINCRONIZANDO...</div></div>

    <div id="rankUpAnim" onclick="this.style.display='none'">
        <div style="text-align:center;">
            <p class="clear-title">MISSION CLEAR</p>
            <div style="background:black; padding:15px 40px; transform:skewX(-15deg); margin-top:20px; border:2px solid white;"><p id="rankStatText" style="font-family:'Anton'; font-size:3rem; color:var(--p5-green); margin:0;"></p></div>
        </div>
    </div>

    <div class="header">
        <div class="title-wrapper">
            <h1>THE WORKERS</h1>
        </div><br>
        <div class="header-subtitle"><i class="fa-solid fa-clock-rotate-left"></i> OBJETIVOS EN CURSO</div>
    </div>

    <main class="mission-container" id="pendientesList"></main>

    <nav class="tab-bar">
        <a href="index.html" class="tab-item"><i class="fa-solid fa-house"></i>INICIO</a>
        <a href="task.html" class="tab-item"><i class="fa-solid fa-skull-crossbones"></i>TASKS</a>
        <a href="history_p.html" class="tab-item active"><i class="fa-solid fa-clock-rotate-left"></i>PENDIENTES</a>
        <a href="history_f.html" class="tab-item"><i class="fa-solid fa-check-double"></i>HISTORIAL</a>
    </nav>

    <div id="mModal" class="modal" onclick="if(event.target == this) window.cerrarModal()">
        <div class="modal-content">
            <div id="mTitle">---</div>
            <div id="mDesc">---</div>
            <div class="modal-btns">
                <button class="m-btn m-btn-ok" onclick="window.completarDesdePendiente()"><i class="fa-solid fa-check"></i> TERMINAR</button>
                <button class="m-btn m-btn-cancel" onclick="window.cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-auth.js";
        import { getFirestore, collection, query, where, onSnapshot, doc, deleteDoc, updateDoc, increment, addDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBjTFuASVM9JpXtM04dKwgaO2bC_thSxXs",
            authDomain: "the-workes.firebaseapp.com",
            projectId: "the-workes",
            storageBucket: "the-workes.firebasestorage.app",
            messagingSenderId: "836433638146",
            appId: "1:836433638146:web:2c1bb69904a82e2f49c81b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let pendientes = [];
        let seleccionadaId = null;

        function renderPendientes() {
            const container = document.getElementById('pendientesList');
            container.innerHTML = "";

            if(pendientes.length === 0) {
                container.innerHTML = "<p style='text-align:center; opacity:0.3; margin-top:50px; grid-column: 1/-1;'>NO HAY MISIONES ACTIVAS</p>";
                return;
            }

            pendientes.forEach(m => {
                const div = document.createElement('div');
                div.className = 'm-card';
                div.onclick = () => abrirModal(m);
                div.innerHTML = `
                    <div class="m-icon"><i class="fa-solid fa-thumbtack"></i></div>
                    <div class="m-info">
                        <h3>${m.titulo}</h3>
                        <p>${m.categoria} > ${m.minicategoria}</p>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function abrirModal(m) {
            seleccionadaId = m.firestoreId;
            document.getElementById('mTitle').innerText = m.titulo;
            document.getElementById('mDesc').innerText = m.descripcion;
            document.getElementById('mModal').style.display = 'flex';
        }

        window.cerrarModal = () => document.getElementById('mModal').style.display = 'none';

        window.completarDesdePendiente = async function() {
            const user = auth.currentUser;
            const mision = pendientes.find(x => x.firestoreId === seleccionadaId);
            if(!mision) return;

            document.getElementById('loadingScreen').style.display = 'flex';
            window.cerrarModal();

            try {
                const puntos = mision.estrellas >= 4 ? 3 : (mision.estrellas === 3 ? 2 : 1);
                const nMega = mision.categoria.trim().toUpperCase(); 
                const nCat = mision.subcategoria.trim();             
                const nHab = mision.minicategoria.trim();            
                
                await addDoc(collection(db, "completadas"), { ...mision, fechaFin: serverTimestamp(), estado: 'completada' });

                const userRef = doc(db, "usuarios", user.uid);
                const actualizaciones = {};
                actualizaciones[`${nMega}.${nCat}.${nHab}`] = increment(puntos);
                actualizaciones["historial"] = arrayUnion({ fecha: new Date().toLocaleString(), accion: `Misión: ${nHab} (+${puntos} EXP)` });

                await updateDoc(userRef, actualizaciones);
                await deleteDoc(doc(db, "pendientes", seleccionadaId));

                document.getElementById('rankStatText').innerText = `+${puntos} EXP`;
                document.getElementById('rankUpAnim').style.display = 'flex';

            } catch(e) { console.error(e); }
            document.getElementById('loadingScreen').style.display = 'none';
        };

        onAuthStateChanged(auth, (user) => {
            if(user) {
                const q = query(collection(db, "pendientes"), where("userId", "==", user.uid));
                onSnapshot(q, (snap) => {
                    pendientes = snap.docs.map(doc => ({ firestoreId: doc.id, ...doc.data() }));
                    renderPendientes();
                });
            } else { window.location.href = "login.html"; }
        });
    </script>
</body>
</html>
